name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-lane:
    name: Fast Lane
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InfernalHierarchy.sln

      - name: Build
        run: dotnet build InfernalHierarchy.sln -c Release --no-restore

      - name: Analyzer Build
        run: dotnet build InfernalHierarchy.sln -c Release --no-restore -p:RunAnalyzersDuringBuild=true -p:EnforceCriticalWarningsAsErrors=true

      - name: Performance Gate
        run: dotnet run --project tools/InfernalHierarchy.PerfGate/InfernalHierarchy.PerfGate.csproj -c Release -- --evidence-out artifacts/perf/perf-evidence.json

      - name: Upload Perf Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-evidence
          path: artifacts/perf/perf-evidence.json

      - name: Fast Tests Core
        run: dotnet test tests/InfernalHierarchy.Core.Tests/InfernalHierarchy.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core-fast.trx"

      - name: Fast Tests Messaging
        run: dotnet test tests/InfernalHierarchy.Messaging.Tests/InfernalHierarchy.Messaging.Tests.csproj -c Release --no-build --logger "trx;LogFileName=messaging-fast.trx"

      - name: Fast Tests Tools
        run: dotnet test tests/InfernalHierarchy.Tools.Tests/InfernalHierarchy.Tools.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tools-fast.trx"

      - name: Upload Fast Lane Artifacts On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fast-failure-artifacts
          path: |
            **/*.trx
            **/TestResults/**
            **/bin/Release/**
            **/obj/Release/**

  full-lane:
    name: Full Lane
    runs-on: ubuntu-latest
    needs: fast-lane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InfernalHierarchy.sln

      - name: Build
        run: dotnet build InfernalHierarchy.sln -c Release --no-restore

      - name: Full Test Suite
        run: dotnet test InfernalHierarchy.sln -c Release --no-build --logger "trx;LogFileName=full-suite.trx"

      - name: Autonomy Scorecard Gate
        run: dotnet test tests/InfernalHierarchy.Host.Tests/InfernalHierarchy.Host.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~AutonomyScorecardGateTests" --logger "trx;LogFileName=autonomy-gate.trx"

      - name: Autonomy Certification Strict Gate
        run: dotnet test tests/InfernalHierarchy.Host.Tests/InfernalHierarchy.Host.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~AutonomyScorecardGateTests.EvaluateCertificationMode_ShouldPass_WhenRealAgentRunsMeetStrictContractAndCoverage" --logger "trx;LogFileName=autonomy-certification-strict-gate.trx"

      - name: Upload Full Lane Artifacts On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-failure-artifacts
          path: |
            **/*.trx
            **/TestResults/**
            **/bin/Release/**
            **/obj/Release/**
