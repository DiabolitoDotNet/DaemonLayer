name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Optional image tag override
        required: false
        default: ""
      simulate_autonomy_gate_failure:
        description: Force an intentional autonomy gate failure (dry-run validation)
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  release:
    name: Build And Smoke
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: infernal-hierarchy
      CONTAINER_NAME: infernal-hierarchy-smoke
      OPERATOR_API_KEY: smoke-operator-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InfernalHierarchy.sln

      - name: Build
        run: dotnet build InfernalHierarchy.sln -c Release --no-restore

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Image Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-${GITHUB_SHA::12}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Release Image
        run: |
          docker build -t "${IMAGE_NAME}:${{ steps.vars.outputs.tag }}" -f Dockerfile .

      - name: Start Smoke Container
        run: |
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 5080:5080 \
            -e Http__Enabled=true \
            -e Http__Urls=http://0.0.0.0:5080 \
            -e Ui__LocalOnly=false \
            -e WebSockets__LocalOnly=false \
            -e OperatorApi__ApiKey="${OPERATOR_API_KEY}" \
            -e OpenTelemetry__Exporters__Console__Enabled=false \
            -e Email__Enabled=true \
            -e Email__Host=smtp.example.com \
            -e Email__Port=25 \
            -e Email__Username=sender@example.com \
            -e Email__Password=secret \
            -e Email__FromAddress=sender@example.com \
            -e EmailInbox__Enabled=true \
            -e EmailInbox__Host=imap.example.com \
            -e EmailInbox__Port=993 \
            -e EmailInbox__UseSsl=true \
            -e EmailInbox__Username=reader@example.com \
            -e EmailInbox__Password=secret \
            -e Telegram__BotToken=dummy \
            -e Telegram__AllowedUserIds=1 \
            -e Telegram__StartupNotificationChatId=1 \
            -e Ollama__BaseUrl=http://127.0.0.1:11434/v1 \
            -e Ollama__DefaultModel=qwen3:8b \
            -e SearXNG__Enabled=false \
            "${IMAGE_NAME}:${{ steps.vars.outputs.tag }}"

      - name: Wait For Health Ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" http://localhost:5080/health/ready || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Health endpoint responded with $code"
              cat /tmp/health.json || true
              exit 0
            fi
            sleep 2
          done
          echo "Health endpoint did not respond in time"
          exit 1

      - name: Chat Round-Trip Smoke
        run: |
          code=$(curl -sS -o /tmp/chat.json -w "%{http_code}" \
            -X POST http://localhost:5080/api/chat \
            -H "Content-Type: application/json" \
            -H "X-Infernal-Operator-Key: ${OPERATOR_API_KEY}" \
            -d '{"message":"smoke-test","toAgentId":"lucifer","timeoutMs":15000}' || true)

          echo "Chat status: $code"
          cat /tmp/chat.json || true

          # Accept success (200) or bounded timeout while proving endpoint/security/routing path (504).
          if [ "$code" != "200" ] && [ "$code" != "504" ]; then
            echo "Unexpected chat status: $code"
            exit 1
          fi

          grep -q '"autonomy_outcome_status"' /tmp/chat.json
          grep -q '"autonomy_outcome_reason_code"' /tmp/chat.json
          grep -q '"autonomy_outcome_autonomous_success"' /tmp/chat.json
          grep -q '"autonomy_outcome_needs_supervisor_intervention"' /tmp/chat.json
          grep -q '"autonomy_outcome_next_action"' /tmp/chat.json

      - name: Autonomy Certification Strict Gate
        run: dotnet test tests/InfernalHierarchy.Host.Tests/InfernalHierarchy.Host.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~AutonomyScorecardGateTests.EvaluateCertificationMode_ShouldPass_WhenRealAgentRunsMeetStrictContractAndCoverage" --logger "trx;LogFileName=release-autonomy-certification-strict-gate.trx"

      - name: Simulate Autonomy Gate Failure (Dry-Run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simulate_autonomy_gate_failure == 'true' }}
        run: |
          echo "Dry-run simulation enabled: forcing autonomy gate failure to validate fail-closed behavior."
          exit 1

      - name: Autonomy Endpoints Smoke
        run: |
          readiness_code=$(curl -sS -o /tmp/autonomy-readiness.json -w "%{http_code}" \
            http://localhost:5080/api/autonomy/readiness \
            -H "X-Infernal-Operator-Key: ${OPERATOR_API_KEY}" || true)

          manifest_code=$(curl -sS -o /tmp/autonomy-manifest.json -w "%{http_code}" \
            http://localhost:5080/api/autonomy/certification-manifest \
            -H "X-Infernal-Operator-Key: ${OPERATOR_API_KEY}" || true)

          slo_code=$(curl -sS -o /tmp/autonomy-slo.json -w "%{http_code}" \
            http://localhost:5080/api/autonomy/slo \
            -H "X-Infernal-Operator-Key: ${OPERATOR_API_KEY}" || true)

          echo "Readiness status: $readiness_code"
          cat /tmp/autonomy-readiness.json || true
          echo "Manifest status: $manifest_code"
          cat /tmp/autonomy-manifest.json || true
          echo "SLO status: $slo_code"
          cat /tmp/autonomy-slo.json || true

          test "$readiness_code" = "200"
          test "$manifest_code" = "200"
          test "$slo_code" = "200"

          grep -q '"allCriticalReady"' /tmp/autonomy-readiness.json
          grep -q '"requirements"' /tmp/autonomy-manifest.json
          grep -q '"ratios"' /tmp/autonomy-slo.json

      - name: Upload Autonomy Smoke Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-autonomy-smoke-evidence
          path: |
            /tmp/chat.json
            /tmp/autonomy-readiness.json
            /tmp/autonomy-manifest.json
            /tmp/autonomy-slo.json

      - name: Upload Smoke Artifacts On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-failure-artifacts
          path: |
            /tmp/health.json
            /tmp/chat.json
            /tmp/autonomy-readiness.json
            /tmp/autonomy-manifest.json
            /tmp/autonomy-slo.json

      - name: Print Container Logs
        if: always()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Stop Container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true
