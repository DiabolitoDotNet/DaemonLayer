# Local workstation compose profile (Windows + Docker Desktop + local Ollama on host)
# Usage:
#   $env:OLLAMA_BASE_URL="http://host.docker.internal:11434/v1"
#   docker compose -f docker-compose.local.yml up -d --build

services:
  infernal-hierarchy:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-base
    container_name: infernal-hierarchy
    environment:
      - Ollama__BaseUrl=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - Ollama__DefaultModel=qwen3:8b
      - Ollama__AlternativeModel=dolphin3:8b
      - Ollama__RequestTimeoutSeconds=600

      # Keep local multi-model router aligned with the intended project defaults
      - LlmOptions__Models__0__Name=qwen3:8b
      - LlmOptions__Models__0__BaseUrl=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - LlmOptions__Models__0__Complexity=Medium
      - LlmOptions__Models__0__Priority=1
      - LlmOptions__Models__0__Temperature=0.7
      - LlmOptions__Models__0__MaxTokens=2048

      - LlmOptions__Models__1__Name=qwen3:8b
      - LlmOptions__Models__1__BaseUrl=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - LlmOptions__Models__1__Complexity=Simple
      - LlmOptions__Models__1__Priority=1
      - LlmOptions__Models__1__Temperature=0.5
      - LlmOptions__Models__1__MaxTokens=1024

      - LlmOptions__Models__2__Name=dolphin3:8b
      - LlmOptions__Models__2__BaseUrl=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - LlmOptions__Models__2__Complexity=Complex
      - LlmOptions__Models__2__Priority=1
      - LlmOptions__Models__2__Temperature=0.8
      - LlmOptions__Models__2__MaxTokens=4096

      - LlmOptions__Models__3__Name=dolphin3:8b
      - LlmOptions__Models__3__BaseUrl=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - LlmOptions__Models__3__Complexity=Expert
      - LlmOptions__Models__3__Priority=1
      - LlmOptions__Models__3__Temperature=0.3
      - LlmOptions__Models__3__MaxTokens=2048

      - SearXNG__BaseUrl=http://searxng:8080
      - SearXNG__Enabled=true

      - Memory__DatabasePath=/app/data/infernal.db
      - MemoryBackup__Enabled=true
      - MemoryBackup__BackupOnStartup=true
      - MemoryBackup__IntervalHours=12
      - MemoryBackup__DirectoryPath=/app/data/backups
      - MemoryBackup__MaxBackupFiles=14
      - MemoryBackup__MaxBackupAgeDays=14

      - MemoryPruningOptions__Enabled=true
      - MemoryPruningOptions__DryRun=false
      - MemoryPruningOptions__PruningIntervalHours=6
      - MemoryPruningOptions__MaxDeletesPerRun=1000
      - MemoryPruningOptions__RetentionDays=21
      - MemoryPruningOptions__MinConfidenceThreshold=0.25
      - MemoryPruningOptions__EnableArchival=false

      - MemoryCompactionOptions__Enabled=true
      - MemoryCompactionOptions__RunOnStartup=false
      - MemoryCompactionOptions__IntervalHours=24
      - MemoryCompactionOptions__MinDatabaseSizeBytes=134217728
      - MemoryCompactionOptions__IncludeErrorReport=false
      - Http__Enabled=true
      - Http__Urls=http://0.0.0.0:5080
      - Ui__LocalOnly=false
      - WebSockets__LocalOnly=false

      - OpenTelemetry__Exporters__Console__Enabled=false

      - TelegramVoice__Enabled=false
      - TelegramVoice__ReplyWithVoice=false
      - Telegram__StartupNotificationChatId=5879484069

      - Voice__Enabled=false
      - Voice__LocalOnly=true
      - VoiceCopilot__Enabled=false

      - DockerSecrets__Enabled=true
      - DockerSecrets__RootPath=/run/secrets
      - OperatorApi__Enabled=true
      - OperatorApi__ApiKey=${OPERATOR_API_KEY:-daemonlayer-local-operator-key}

      # Optional IMAP inbox config for email_inbox_query (set via local env vars)
      - EmailInbox__Enabled=${EMAIL_INBOX_ENABLED:-false}
      - EmailInbox__Host=${EMAIL_INBOX_HOST:-}
      - EmailInbox__Port=${EMAIL_INBOX_PORT:-993}
      - EmailInbox__UseSsl=${EMAIL_INBOX_USE_SSL:-true}
      - EmailInbox__Username=${EMAIL_INBOX_USERNAME:-}
      - EmailInbox__Password=${EMAIL_INBOX_PASSWORD:-}
      - EmailInbox__Folder=${EMAIL_INBOX_FOLDER:-INBOX}
      - EmailInbox__TimeoutMs=${EMAIL_INBOX_TIMEOUT_MS:-15000}
      - EmailInbox__MaxResults=${EMAIL_INBOX_MAX_RESULTS:-20}

      - GitHubPublisher__Enabled=false
      - BraveSearch__Enabled=false
      - AgentSupervisor__Enabled=false
      - MemoryLearningOptions__Enabled=false
      - AutonomyReadiness__FailStartupOnCriticalNotReady=false

      - OnnxEmbeddingOptions__Enabled=false
      - VectorMemoryOptions__Enabled=true
      - VectorMemoryOptions__QdrantUrl=http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./souls:/souls
      - ./templates:/app/templates:ro
    depends_on:
      - searxng
      - qdrant
    restart: unless-stopped
    networks:
      - infernal-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5080:5080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    secrets:
      - telegram_bot_token
      - telegram_user_ids
      - telegram_lucifer_preamble
      - email_smtp_json
      - github_publisher_token
      - github_publisher_username
      - brave_search_api_key

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    networks:
      - infernal-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - infernal-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  infernal-network:
    driver: bridge

volumes:
  qdrant_data:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_user_ids:
    file: ./secrets/telegram_user_ids.txt
  telegram_lucifer_preamble:
    file: ./secrets/telegram_lucifer_preamble.txt
  email_smtp_json:
    file: ./secrets/email_smtp.json
  github_publisher_token:
    file: ./secrets/github_publisher_token.txt
  github_publisher_username:
    file: ./secrets/github_publisher_username.txt
  brave_search_api_key:
    file: ./secrets/brave_search_api_key.txt
