# Docker Compose pour services locaux (Ollama + SearXNG + Qdrant)

services:
  # Ollama - Local LLM server (OpenAI-compatible API)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - infernal-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Single model for the whole application
      - OLLAMA_MODEL=qwen3:8b
    volumes:
      - ollama_data:/root/.ollama
    command: ["serve"]

  # One-shot init container: pulls the single configured model into the shared volume.
  # Safe to re-run; Ollama will no-op if the model is already present.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    networks:
      - infernal-network
    depends_on:
      - ollama
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434
      - OLLAMA_MODEL=qwen3:8b
    volumes:
      - ollama_data:/root/.ollama
    command: ["pull", "qwen3:8b"]

  # InfernalHierarchy .NET Worker Service
  infernal-hierarchy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infernal-hierarchy
    environment:
      - Ollama__BaseUrl=http://ollama:11434/v1
      - Ollama__DefaultModel=qwen3:8b
      - Ollama__AlternativeModel=dolphin3:8b
      - Ollama__RequestTimeoutSeconds=600
      - SearXNG__BaseUrl=http://searxng:8080
      - SearXNG__Enabled=true
      - Memory__DatabasePath=/app/data/infernal.db
      - Http__Enabled=true
      - Http__Urls=http://0.0.0.0:5080
      - Ui__LocalOnly=false
      - WebSockets__LocalOnly=false

      # Reduce log noise: disable OpenTelemetry console trace exporter
      - OpenTelemetry__Exporters__Console__Enabled=false

      # Telegram voice replies (agent reports -> Telegram voice note)
      - TelegramVoice__Enabled=false
      - TelegramVoice__ReplyWithVoice=false

      # Telegram startup notification (set to your private chat id / user id)
      - Telegram__StartupNotificationChatId=5879484069

      # Voice features stay disabled in the base image/compose profile.
      # Enable them with docker-compose.voice.yml (uses the runtime-voice target).
      - Voice__Enabled=false
      - Voice__LocalOnly=true
      - VoiceCopilot__Enabled=false

      # Ensure docker secrets are honored in container runs.
      - DockerSecrets__Enabled=true
      - DockerSecrets__RootPath=/run/secrets

      # GitHub publisher (token + username come from docker secrets)
      - GitHubPublisher__Enabled=false

      # Web search fallback (api key comes from docker secrets)
      - BraveSearch__Enabled=false

      # Background services
      - AgentSupervisor__Enabled=false
      - MemoryLearningOptions__Enabled=false

      # ONNX embeddings are optional and enabled via docker-compose.onnx.yml.
      - OnnxEmbeddingOptions__Enabled=false
      - VectorMemoryOptions__Enabled=true
      - VectorMemoryOptions__QdrantUrl=http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./souls:/souls
      - ./templates:/app/templates:ro
    depends_on:
      - ollama
      - searxng
      - qdrant
    restart: unless-stopped
    networks:
      - infernal-network
    ports:
      - "5080:5080"
    secrets:
      - telegram_bot_token
      - telegram_user_ids
      - telegram_lucifer_preamble
      - email_smtp_json
      - github_publisher_token
      - github_publisher_username
      - brave_search_api_key

  # SearXNG - Local web search engine
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    networks:
      - infernal-network

  # Qdrant - Vector database for semantic search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - infernal-network
    restart: unless-stopped

networks:
  infernal-network:
    driver: bridge

volumes:
  qdrant_data:
  ollama_data:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_user_ids:
    file: ./secrets/telegram_user_ids.txt
  telegram_lucifer_preamble:
    file: ./secrets/telegram_lucifer_preamble.txt
  email_smtp_json:
    file: ./secrets/email_smtp.json
  github_publisher_token:
    file: ./secrets/github_publisher_token.txt
  github_publisher_username:
    file: ./secrets/github_publisher_username.txt
  brave_search_api_key:
    file: ./secrets/brave_search_api_key.txt

# Usage:
# docker compose up -d
# Accès: http://localhost:8080
