# Docker Compose pour services locaux (Ollama + SearXNG + Qdrant)

services:
  # Ollama - Local LLM server (OpenAI-compatible API)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - infernal-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Single model for the whole application
      - OLLAMA_MODEL=llama3.1:8b
    volumes:
      - ollama_data:/root/.ollama
    command: ["serve"]

  # One-shot init container: pulls the single configured model into the shared volume.
  # Safe to re-run; Ollama will no-op if the model is already present.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    networks:
      - infernal-network
    depends_on:
      - ollama
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
    volumes:
      - ollama_data:/root/.ollama
    command: ["pull", "llama3.1:8b"]

  # InfernalHierarchy .NET Worker Service
  infernal-hierarchy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infernal-hierarchy
    environment:
      - Ollama__BaseUrl=http://ollama:11434/v1
      - Ollama__DefaultModel=llama3.1:8b
      - Ollama__AlternativeModel=qwen3:14b
      - Ollama__RequestTimeoutSeconds=600
      - SearXNG__BaseUrl=http://searxng:8080
      - SearXNG__Enabled=true
      - Memory__DatabasePath=/app/data/infernal.db
      - Http__Enabled=true
      - Http__Urls=http://0.0.0.0:5080
      - Ui__LocalOnly=false
      - WebSockets__LocalOnly=false

      # Reduce log noise: disable OpenTelemetry console trace exporter
      - OpenTelemetry__Exporters__Console__Enabled=false

      # Telegram voice replies (agent reports -> Telegram voice note)
      - TelegramVoice__Enabled=true
      - TelegramVoice__ReplyWithVoice=true

      # Telegram startup notification (set to your private chat id / user id)
      - Telegram__StartupNotificationChatId=5879484069

      # Voice API (enabled by default in docker-compose)
      - Voice__Enabled=true
      - Voice__LocalOnly=false

      # Voice Copilot (transcript -> short FR reply -> optional TTS fire-and-forget)
      - VoiceCopilot__Enabled=true
      - VoiceCopilot__SpeakByDefault=true
      - VoiceCopilot__MaxHistoryMessages=6
      - VoiceCopilot__Temperature=0.4
      - VoiceCopilot__MaxTokens=140

      # Shared Hugging Face cache for Faster-Whisper + Kokoro
      - HF_HOME=/models/hf

      # STT (Faster-Whisper: large-v3-turbo)
      - VoiceTranscription__Enabled=true
      - VoiceTranscription__ExecutablePath=/opt/voice-venv/bin/python
      - VoiceTranscription__RootDirectory=/app/data/voice
      - VoiceTranscription__DecoderExecutablePath=/usr/bin/ffmpeg
      - VoiceTranscription__Arguments__0=/app/voice/faster_whisper_transcribe.py
      - VoiceTranscription__Arguments__1=--input
      - VoiceTranscription__Arguments__2={input}
      - VoiceTranscription__Arguments__3=--model
      - VoiceTranscription__Arguments__4=large-v3-turbo
      - VoiceTranscription__Arguments__5=--device
      - VoiceTranscription__Arguments__6=cpu
      - VoiceTranscription__Arguments__7=--compute_type
      - VoiceTranscription__Arguments__8=int8
      - VoiceTranscription__Arguments__9=--language
      - VoiceTranscription__Arguments__10=en

      # TTS (Kokoro-82M via python)
      - TextToSpeech__Enabled=true
      - TextToSpeech__UsePiperNet=false
      - TextToSpeech__RootDirectory=/app/data/voice
      - TextToSpeech__OutputExtension=.wav
      - TextToSpeech__ExecutablePath=/opt/voice-venv/bin/python
      - TextToSpeech__Arguments__0=/app/voice/kokoro_tts.py
      - TextToSpeech__Arguments__1=--text
      - TextToSpeech__Arguments__2={text}
      - TextToSpeech__Arguments__3=--output
      - TextToSpeech__Arguments__4={output}
      - TextToSpeech__Arguments__5=--voice
      - TextToSpeech__Arguments__6=ff_siwis
      - TextToSpeech__Arguments__7=--lang_code
      - TextToSpeech__Arguments__8=f
      - TextToSpeech__Arguments__9=--sample_rate
      - TextToSpeech__Arguments__10=24000

      # Ensure docker secrets are honored in container runs.
      - DockerSecrets__Enabled=true
      - DockerSecrets__RootPath=/run/secrets

      # GitHub publisher (token + username come from docker secrets)
      - GitHubPublisher__Enabled=true

      # Web search fallback (api key comes from docker secrets)
      - BraveSearch__Enabled=true

      # Background services
      - AgentSupervisor__Enabled=true
      - MemoryLearningOptions__Enabled=true

      # Local embeddings (falls back deterministically if model/tokenizer missing)
      - OnnxEmbeddingOptions__Enabled=true
      - OnnxEmbeddingOptions__ModelPath=/app/models/sentence-transformers/model.onnx
      - OnnxEmbeddingOptions__TokenizerPath=/app/models/sentence-transformers/tokenizer.json
      - OnnxEmbeddingOptions__EmbeddingDimension=384
      - OnnxEmbeddingOptions__MaxSequenceLength=128
      - VectorMemoryOptions__Enabled=true
      - VectorMemoryOptions__QdrantUrl=http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./souls:/souls
      - ./templates:/app/templates:ro
      - ./models/hf:/models/hf
      - ./models/sentence-transformers:/app/models/sentence-transformers:ro
    depends_on:
      - ollama
      - searxng
      - qdrant
    restart: unless-stopped
    networks:
      - infernal-network
    ports:
      - "5080:5080"
    secrets:
      - telegram_bot_token
      - telegram_user_ids
      - telegram_lucifer_preamble
      - email_smtp_json
      - github_publisher_token
      - github_publisher_username
      - brave_search_api_key

  # SearXNG - Local web search engine
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    networks:
      - infernal-network

  # Qdrant - Vector database for semantic search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - infernal-network
    restart: unless-stopped

networks:
  infernal-network:
    driver: bridge

volumes:
  qdrant_data:
  ollama_data:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_user_ids:
    file: ./secrets/telegram_user_ids.txt
  telegram_lucifer_preamble:
    file: ./secrets/telegram_lucifer_preamble.txt
  email_smtp_json:
    file: ./secrets/email_smtp.json
  github_publisher_token:
    file: ./secrets/github_publisher_token.txt
  github_publisher_username:
    file: ./secrets/github_publisher_username.txt
  brave_search_api_key:
    file: ./secrets/brave_search_api_key.txt

# Usage:
# docker compose up -d
# Accès: http://localhost:8080
