# Docker Compose pour services locaux (SearXNG)

services:
  # InfernalHierarchy .NET Worker Service
  infernal-hierarchy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infernal-hierarchy
    environment:
      - Ollama__BaseUrl=http://host.docker.internal:11434/v1
      - SearXNG__BaseUrl=http://searxng:8080
      - SearXNG__Enabled=true
      - Memory__DatabasePath=/app/data/infernal.db
      - Http__Enabled=true
      - Http__Urls=http://0.0.0.0:5080
      - Ui__LocalOnly=false
      - WebSockets__LocalOnly=false

      # Ensure docker secrets are honored in container runs.
      - DockerSecrets__Enabled=true
      - DockerSecrets__RootPath=/run/secrets
      - VectorMemoryOptions__Enabled=true
      - VectorMemoryOptions__QdrantUrl=http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./souls:/souls
      - ./templates:/app/templates:ro
    depends_on:
      - searxng
      - qdrant
    restart: unless-stopped
    networks:
      - infernal-network
    ports:
      - "5080:5080"
    secrets:
      - telegram_bot_token
      - telegram_user_ids
      - email_smtp_json

  # SearXNG - Local web search engine
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    networks:
      - infernal-network

  # Qdrant - Vector database for semantic search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - infernal-network
    restart: unless-stopped

networks:
  infernal-network:
    driver: bridge

volumes:
  qdrant_data:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_user_ids:
    file: ./secrets/telegram_user_ids.txt
  email_smtp_json:
    file: ./secrets/email_smtp.json

# Usage:
# docker-compose up -d
# Accès: http://localhost:8080
